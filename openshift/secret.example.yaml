# 이 파일은 템플릿입니다. 실제 값을 채운 사본은 절대 Git에 커밋하지 마세요.
#
# 권장 방법 (커밋 없이 클러스터에 직접 생성):
#   oc create secret generic product-search-server-secrets \
#     --from-literal=WATSONX_API_KEY=... \
#     --from-literal=WATSONX_PROJECT_ID=... \
#     --from-literal=WATSONX_URL=... \
#     --from-literal=WATSONX_MODEL_ID=... \
#     --from-literal=SERPAPI_API_KEY=...
#
# 아래 YAML은 GitOps로 관리하고 싶을 때 참고용 형태입니다 (Sealed Secrets나
# 외부 Secret 매니저와 함께 쓰는 걸 권장, 평문 그대로 리포에 올리지 말 것).
apiVersion: v1
kind: Secret
metadata:
  name: product-search-server-secrets
  labels:
    app: product-search-server
type: Opaque
stringData:
  WATSONX_API_KEY: "REPLACE_ME"
  WATSONX_PROJECT_ID: "REPLACE_ME"
  WATSONX_URL: "REPLACE_ME"
  WATSONX_MODEL_ID: "REPLACE_ME"
  SERPAPI_API_KEY: "REPLACE_ME"
  # 이벤트 탭(회원가입/로그인 포함) 백엔드용
  FIREBASE_SERVICE_ACCOUNT_JSON: "REPLACE_ME"   # Firebase 콘솔에서 발급한 서비스 계정 JSON 전체를 문자열로
