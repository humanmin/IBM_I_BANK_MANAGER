name: CD

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  android-release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # PRODUCT_SEARCH_API_URL is a server endpoint, not a secret — manage it
      # as a repository Variable (Settings > Secrets and variables > Actions > Variables).
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=PRODUCT_SEARCH_API_URL=${{ vars.PRODUCT_SEARCH_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

# server-deploy job 제거됨 (2024 개정):
# 서버 컴포넌트의 빌드/배포는 이제 GitHub Actions가 아니라 OpenShift Pipelines
# (Tekton)가 클러스터 안에서 직접 담당합니다. main 브랜치의 server/** 변경은
# GitHub 웹훅을 통해 OpenShift EventListener가 감지하고, 클러스터 내부에서
# git-clone → node --test → buildah build&push → rollout 대기 → /health
# 스모크테스트까지 자동 실행합니다.
#
# 관련 리소스: pipelines/*.yaml, openshift/*.yaml
# GitHub Actions는 여전히 이 서버 코드에 대한 PR 단계 테스트(ci.yml의
# server-ci job)만 담당해 빠른 피드백을 제공합니다.
