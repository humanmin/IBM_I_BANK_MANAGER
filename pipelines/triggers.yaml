# GitHub 저장소 Settings > Webhooks 에 등록할 때 사용할 시크릿.
# 값은 openssl rand -hex 20 등으로 직접 생성해서 채우고, GitHub 웹훅 설정 화면의
# "Secret" 필드에 동일한 값을 입력하세요. (이 파일도 실제 값 채운 채로 커밋 금지)
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
type: Opaque
stringData:
  secretToken: "REPLACE_ME"
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: product-search-server-template
spec:
  params:
    - name: git-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: product-search-server-run-
      spec:
        pipelineRef:
          name: product-search-server-pipeline
        serviceAccountName: pipeline
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          # TODO: 실제 네임스페이스/Route 도메인으로 교체
          - name: namespace
            value: CHANGE_ME_NAMESPACE
          - name: health-url
            value: https://product-search-server-CHANGE_ME_NAMESPACE.apps.CHANGE_ME_CLUSTER_DOMAIN/health
        workspaces:
          - name: shared-workspace
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: product-search-server
spec:
  serviceAccountName: el-product-search-server
  triggers:
    - name: github-push-main
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: ["push"]
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.ref == 'refs/heads/main' && body.commits.exists(c, c.modified.exists(f, f.startsWith('server/')) || c.added.exists(f, f.startsWith('server/')))"
      bindings:
        - ref: github-push-binding
      template:
        ref: product-search-server-template
